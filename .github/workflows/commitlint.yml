name: Commit messages (commitlint)

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  # The action lists the PR's commits over the API; without this the read-only
  # token on Dependabot PRs returns 403 "Resource not accessible by integration".
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.cjs
          failOnWarnings: false
