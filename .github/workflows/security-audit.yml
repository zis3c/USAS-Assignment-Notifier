name: Security Audit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run pip-audit (fail on known vulns)
        run: |
          IGNORE_ARGS=()
          while IFS= read -r line || [ -n "$line" ]; do
            vuln_id="$(echo "$line" | xargs)"
            if [ -n "$vuln_id" ] && [[ ! "$vuln_id" =~ ^# ]]; then
              IGNORE_ARGS+=(--ignore-vuln "$vuln_id")
            fi
          done < .pip-audit-ignore.txt
          pip-audit -r requirements.txt "${IGNORE_ARGS[@]}" --progress-spinner off
